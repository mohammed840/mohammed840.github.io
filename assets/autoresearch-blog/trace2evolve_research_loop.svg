<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">Trace2Evolve research loop</title>
  <desc id="desc">A six step loop from locked benchmark to promotion decision.</desc>
  <rect width="1180" height="360" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Trace2Evolve AutoResearch Loop</text>
  <text x="48" y="88" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Every agent change is treated as a benchmarked candidate with evidence, not a blind prompt edit.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(48 136)">
      <rect width="150" height="100" rx="10" fill="#dbeafe" stroke="#2563eb"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1. Run</text>
      <text x="75" y="62" text-anchor="middle" font-size="12" fill="#1e40af">tau2 retail</text>
      <text x="75" y="80" text-anchor="middle" font-size="12" fill="#1e40af">holdout split</text>
    </g>
    <g transform="translate(238 136)">
      <rect width="150" height="100" rx="10" fill="#dcfce7" stroke="#16a34a"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">2. Score</text>
      <text x="75" y="62" text-anchor="middle" font-size="12" fill="#166534">reward + action</text>
      <text x="75" y="80" text-anchor="middle" font-size="12" fill="#166534">matching</text>
    </g>
    <g transform="translate(428 136)">
      <rect width="150" height="100" rx="10" fill="#fef3c7" stroke="#d97706"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">3. Diagnose</text>
      <text x="75" y="62" text-anchor="middle" font-size="12" fill="#92400e">failure cluster</text>
      <text x="75" y="80" text-anchor="middle" font-size="12" fill="#92400e">from traces</text>
    </g>
    <g transform="translate(618 136)">
      <rect width="150" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">4. Patch</text>
      <text x="75" y="62" text-anchor="middle" font-size="12" fill="#5b21b6">editable</text>
      <text x="75" y="80" text-anchor="middle" font-size="12" fill="#5b21b6">program.py</text>
    </g>
    <g transform="translate(808 136)">
      <rect width="150" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">5. Rerun</text>
      <text x="75" y="62" text-anchor="middle" font-size="12" fill="#0369a1">heldout</text>
      <text x="75" y="80" text-anchor="middle" font-size="12" fill="#0369a1">task IDs</text>
    </g>
    <g transform="translate(998 136)">
      <rect width="140" height="100" rx="10" fill="#fee2e2" stroke="#dc2626"/>
      <text x="70" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">6. Gate</text>
      <text x="70" y="62" text-anchor="middle" font-size="12" fill="#991b1b">promote or</text>
      <text x="70" y="80" text-anchor="middle" font-size="12" fill="#991b1b">evidence only</text>
    </g>
    <path d="M198 186 H230" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M388 186 H420" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M578 186 H610" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M768 186 H800" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M958 186 H990" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  <path d="M1068 246 C1040 320, 170 320, 124 246" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="590" y="316" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">discarded candidates become evidence for the next hypothesis</text>
</svg>
