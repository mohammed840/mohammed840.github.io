  <text x="732" y="146" font-family="Arial, sans-serif" font-size="13" fill="#111827">candidate up</text>
  <rect x="805" y="134" width="14" height="14" fill="#ef4444"/>
  <text x="824" y="146" font-family="Arial, sans-serif" font-size="13" fill="#111827">down</text>
</svg>
