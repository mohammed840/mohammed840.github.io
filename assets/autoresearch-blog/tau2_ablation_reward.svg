<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
  <title id="title">tau2 candidate ablation study</title>
  <desc id="desc">Reward comparison for baseline, full v5, and three rule-removal ablations on retail tasks 100-113.</desc>
  <rect width="920" height="380" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Candidate Ablation: Retail Tasks 100-113</text>
  <text x="48" y="78" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Same holdout, one rule removed at a time. Reward is tau2 average task reward.</text>
  <line x1="100" y1="310" x2="850" y2="310" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="110" x2="100" y2="310" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="210" x2="850" y2="210" stroke="#e2e8f0"/>
  <text x="62" y="314" font-family="Arial, sans-serif" font-size="12" fill="#64748b">0.00</text>
  <text x="62" y="214" font-family="Arial, sans-serif" font-size="12" fill="#64748b">0.25</text>
  <text x="62" y="114" font-family="Arial, sans-serif" font-size="12" fill="#64748b">0.50</text>
  <rect x="150" y="310" width="90" height="0" fill="#64748b"/>
  <rect x="285" y="224" width="90" height="86" fill="#2563eb"/>
  <rect x="420" y="167" width="90" height="143" fill="#16a34a"/>
  <rect x="555" y="281" width="90" height="29" fill="#ef4444"/>
  <rect x="690" y="224" width="90" height="86" fill="#0f766e"/>
  <text x="163" y="334" font-family="Arial, sans-serif" font-size="13" fill="#111827">baseline</text>
  <text x="303" y="334" font-family="Arial, sans-serif" font-size="13" fill="#111827">full v5</text>
  <text x="414" y="334" font-family="Arial, sans-serif" font-size="13" fill="#111827">no user details</text>
  <text x="548" y="334" font-family="Arial, sans-serif" font-size="13" fill="#111827">no cross-order</text>
  <text x="683" y="334" font-family="Arial, sans-serif" font-size="13" fill="#111827">no loop guard</text>
  <text x="176" y="300" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">0.00</text>
  <text x="311" y="217" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">0.214</text>
  <text x="446" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">0.357</text>
  <text x="581" y="274" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">0.071</text>
  <text x="716" y="217" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#115e59">0.214</text>
</svg>
