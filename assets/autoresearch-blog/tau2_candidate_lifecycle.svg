<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-labelledby="title desc">
  <title id="title">Candidate lifecycle</title>
  <desc id="desc">Timeline showing evidence-only v3 and promoted v5 candidate.</desc>
  <rect width="1180" height="400" fill="#f8fafc"/>
  <text x="54" y="56" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">Candidate Lifecycle</text>
  <text x="54" y="86" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Trace2Evolve keeps partial improvements as evidence and promotes only candidates that pass reliability checks.</text>
  <line x1="110" y1="210" x2="1065" y2="210" stroke="#64748b" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="170" cy="210" r="14" fill="#64748b"/>
    <text x="170" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">baseline</text>
    <text x="170" y="278" text-anchor="middle" font-size="13" fill="#475569">reward 0.30</text>
    <circle cx="520" cy="210" r="14" fill="#f59e0b"/>
    <rect x="390" y="116" width="260" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="520" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">v3 evidence only</text>
    <text x="520" y="168" text-anchor="middle" font-size="13" fill="#92400e">reward 0.40, max-step gate failed</text>
    <circle cx="890" cy="210" r="14" fill="#16a34a"/>
    <rect x="750" y="236" width="280" height="78" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="890" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">v5 promoted</text>
    <text x="890" y="290" text-anchor="middle" font-size="13" fill="#166534">reward 0.60, all checks passed</text>
  </g>
</svg>
