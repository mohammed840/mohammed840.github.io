<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Continuity artifacts for long running agents</title>
  <desc id="desc">A handoff diagram showing how one agent session leaves durable artifacts for the next session.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .session { fill: #f7f7f7; stroke: #d6d6d6; stroke-width: 1.5; }
      .artifact { fill: #eef5ff; stroke: #2463ad; stroke-width: 1.6; }
      .next { fill: #fff8e8; stroke: #a46a00; stroke-width: 1.8; }
      .label { font-family: Georgia, serif; font-size: 25px; font-weight: 700; fill: #111; }
      .small { font-family: Georgia, serif; font-size: 17px; fill: #222; }
      .tiny { font-family: Georgia, serif; font-size: 14px; fill: #555; }
      .arrow { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="660"/>
  <text x="55" y="55" class="label">Continuity Is an Architecture Problem</text>
  <text x="55" y="86" class="small">Long-running agents need external memory that survives context resets, crashes, and handoffs.</text>

  <rect x="65" y="135" width="300" height="415" rx="12" class="session"/>
  <text x="115" y="175" class="label" font-size="22">Session N</text>
  <text x="95" y="210" class="small">Agent works on one slice</text>
  <text x="95" y="238" class="tiny">implements, tests, learns</text>

  <rect x="425" y="110" width="250" height="80" rx="10" class="artifact"/>
  <text x="465" y="142" class="small">Feature list</text>
  <text x="465" y="166" class="tiny">expected behavior, pass or fail</text>

  <rect x="425" y="220" width="250" height="80" rx="10" class="artifact"/>
  <text x="465" y="252" class="small">Progress log</text>
  <text x="465" y="276" class="tiny">what changed, what remains</text>

  <rect x="425" y="330" width="250" height="80" rx="10" class="artifact"/>
  <text x="465" y="362" class="small">Git history</text>
  <text x="465" y="386" class="tiny">recoverable checkpoints</text>

  <rect x="425" y="440" width="250" height="80" rx="10" class="artifact"/>
  <text x="465" y="472" class="small">Init and test scripts</text>
  <text x="465" y="496" class="tiny">repeatable environment setup</text>

  <rect x="735" y="135" width="300" height="415" rx="12" class="next"/>
  <text x="785" y="175" class="label" font-size="22">Session N + 1</text>
  <text x="765" y="210" class="small">Agent starts from evidence</text>
  <text x="765" y="238" class="tiny">not from vague memory</text>

  <line x1="365" y1="340" x2="425" y2="150" class="arrow"/>
  <line x1="365" y1="340" x2="425" y2="260" class="arrow"/>
  <line x1="365" y1="340" x2="425" y2="370" class="arrow"/>
  <line x1="365" y1="340" x2="425" y2="480" class="arrow"/>
  <line x1="675" y1="150" x2="735" y2="340" class="arrow"/>
  <line x1="675" y1="260" x2="735" y2="340" class="arrow"/>
  <line x1="675" y1="370" x2="735" y2="340" class="arrow"/>
  <line x1="675" y1="480" x2="735" y2="340" class="arrow"/>

  <text x="92" y="595" class="tiny">Design principle: do not ask the next agent to guess. Write the project state into artifacts it can inspect and verify.</text>
</svg>
