<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation stack for agent harnesses</title>
  <desc id="desc">A layered evaluation stack moving from fast checks to realistic user and production signals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .layer1 { fill: #f7f7f7; stroke: #d8d8d8; stroke-width: 1.4; }
      .layer2 { fill: #eef5ff; stroke: #2463ad; stroke-width: 1.6; }
      .layer3 { fill: #f2f8f3; stroke: #287a3e; stroke-width: 1.6; }
      .layer4 { fill: #fff8e8; stroke: #a46a00; stroke-width: 1.6; }
      .label { font-family: Georgia, serif; font-size: 25px; font-weight: 700; fill: #111; }
      .small { font-family: Georgia, serif; font-size: 17px; fill: #222; }
      .tiny { font-family: Georgia, serif; font-size: 14px; fill: #555; }
      .arrow { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="660"/>
  <text x="55" y="55" class="label">Evaluation Is the Harness Reward Signal</text>
  <text x="55" y="86" class="small">A good harness gives the agent many ways to discover whether its work actually helped.</text>

  <rect x="135" y="470" width="830" height="80" rx="10" class="layer1"/>
  <text x="180" y="503" class="small">Fast checks</text>
  <text x="180" y="528" class="tiny">format checks, type checks, unit tests, schema tests</text>

  <rect x="170" y="370" width="760" height="80" rx="10" class="layer2"/>
  <text x="215" y="403" class="small">Integration checks</text>
  <text x="215" y="428" class="tiny">tool mocks, database fixtures, API contracts, permissions</text>

  <rect x="205" y="270" width="690" height="80" rx="10" class="layer3"/>
  <text x="250" y="303" class="small">User-level checks</text>
  <text x="250" y="328" class="tiny">browser tests, task completion, document review, workflow traces</text>

  <rect x="240" y="170" width="620" height="80" rx="10" class="layer4"/>
  <text x="285" y="203" class="small">Outcome checks</text>
  <text x="285" y="228" class="tiny">human review, benchmark score, production telemetry, regressions</text>

  <line x1="550" y1="470" x2="550" y2="450" class="arrow"/>
  <line x1="550" y1="370" x2="550" y2="350" class="arrow"/>
  <line x1="550" y1="270" x2="550" y2="250" class="arrow"/>

  <path d="M 860 210 C 1010 285 1010 500 965 510" class="arrow"/>
  <text x="777" y="582" class="tiny">Failures become new tests, docs, or constraints.</text>
  <text x="90" y="615" class="tiny">Design principle: do not use one reward. Use a stack of checks that catches syntax, behavior, workflow, and real outcome failures.</text>
</svg>
