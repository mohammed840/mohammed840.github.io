<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">The Product Is A Grounded Claim Trace</title>
  <desc id="desc">Diagram showing a ClaimCheck verifier converting question, answer, and evidence into claim-level JSON with verdict, quote, evidence IDs, and unsupported span.</desc>
  <rect width="1500" height="760" fill="#f7f8f4"/>
  <text x="64" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#183d3a">① THE PRODUCT IS NOT A LABEL</text>
  <text x="64" y="126" font-family="Arial, sans-serif" font-size="25" fill="#425f5a">The verifier has to produce an auditable claim trace, not just say supported or unsupported.</text>

  <rect x="80" y="190" width="360" height="350" rx="18" fill="#ffffff" stroke="#cfd8d3" stroke-width="2"/>
  <text x="112" y="236" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d3a">Input</text>
  <text x="112" y="292" font-family="Arial, sans-serif" font-size="20" fill="#425f5a">Question</text>
  <text x="112" y="322" font-family="Arial, sans-serif" font-size="18" fill="#5d716d">What is the deadline?</text>
  <text x="112" y="382" font-family="Arial, sans-serif" font-size="20" fill="#425f5a">Answer</text>
  <text x="112" y="412" font-family="Arial, sans-serif" font-size="18" fill="#5d716d">Submit within 14 days.</text>
  <text x="112" y="472" font-family="Arial, sans-serif" font-size="20" fill="#425f5a">Evidence</text>
  <text x="112" y="502" font-family="Arial, sans-serif" font-size="18" fill="#5d716d">E1: submit within 7 days.</text>

  <path d="M470 365 H585" stroke="#2d7785" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="610" y="170" width="470" height="395" rx="18" fill="#eef5f4" stroke="#9ec4c1" stroke-width="2"/>
  <text x="642" y="214" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d3a">Verifier JSON</text>
  <rect x="642" y="250" width="170" height="46" rx="10" fill="#2d7785"/>
  <text x="668" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">final_verdict</text>
  <text x="838" y="280" font-family="Arial, sans-serif" font-size="20" fill="#183d3a">contradicted</text>
  <rect x="642" y="324" width="170" height="46" rx="10" fill="#2d7785"/>
  <text x="683" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">quote</text>
  <text x="838" y="354" font-family="Arial, sans-serif" font-size="20" fill="#183d3a">"within 7 days"</text>
  <rect x="642" y="398" width="170" height="46" rx="10" fill="#2d7785"/>
  <text x="674" y="428" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">evidence</text>
  <text x="838" y="428" font-family="Arial, sans-serif" font-size="20" fill="#183d3a">["E1"]</text>
  <rect x="642" y="472" width="170" height="46" rx="10" fill="#2d7785"/>
  <text x="666" y="502" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">bad span</text>
  <text x="838" y="502" font-family="Arial, sans-serif" font-size="20" fill="#183d3a">"14 days"</text>

  <path d="M1110 365 H1225" stroke="#bf6f5a" stroke-width="5" marker-end="url(#arrow2)"/>

  <rect x="1250" y="225" width="190" height="280" rx="18" fill="#fff7ef" stroke="#e3b4a3" stroke-width="2"/>
  <text x="1280" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7d3d2f">Reward</text>
  <text x="1280" y="330" font-family="Arial, sans-serif" font-size="20" fill="#7d3d2f">not just:</text>
  <text x="1280" y="362" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7d3d2f">label = right</text>
  <text x="1280" y="420" font-family="Arial, sans-serif" font-size="20" fill="#7d3d2f">also:</text>
  <text x="1280" y="452" font-family="Arial, sans-serif" font-size="18" fill="#7d3d2f">quote exists</text>
  <text x="1280" y="478" font-family="Arial, sans-serif" font-size="18" fill="#7d3d2f">evidence exists</text>
  <text x="1280" y="504" font-family="Arial, sans-serif" font-size="18" fill="#7d3d2f">span is local</text>

  <text x="260" y="655" font-family="Arial, sans-serif" font-size="26" font-style="italic" fill="#425f5a">A correct verdict without evidence is not the deliverable. The trace is the deliverable.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d7785"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#bf6f5a"/></marker>
  </defs>
</svg>
