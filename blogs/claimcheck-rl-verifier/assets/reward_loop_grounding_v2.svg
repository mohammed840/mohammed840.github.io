<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Grounding-Aware Reward Loop</title>
  <desc id="desc">A verifier receives question, answer, and evidence, generates JSON, then passes through validity, verdict, evidence ID, quote, unsupported-span, and false-supported checks before total reward drives a policy update.</desc>
  <defs>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="reward" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#be123c"/>
    </marker>
  </defs>

  <rect width="1800" height="980" fill="#fbfcfe"/>
  <rect x="54" y="46" width="1692" height="888" rx="30" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="90" y="108" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#111827">Grounding-aware reward checks the evidence relationship, not only the verdict</text>
  <text x="90" y="148" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Each structured JSON answer is scored through concrete checks before reward updates the policy.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="238" width="280" height="142" rx="18" fill="url(#input)" stroke="#bfdbfe"/>
    <text x="230" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">Question + answer</text>
    <text x="230" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">+ evidence</text>
    <text x="230" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">input bundle</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="478" y="238" width="280" height="142" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="618" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">Verifier</text>
    <text x="618" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">generates JSON</text>
    <text x="618" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">claims, evidence, quote, verdict</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M966 218 L1128 309 L966 400 L804 309 Z" fill="url(#check)" stroke="#94a3b8"/>
    <text x="966" y="303" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" fill="#0f172a">Valid</text>
    <text x="966" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" fill="#0f172a">JSON?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="102" width="242" height="114" rx="18" fill="url(#bad)" stroke="#fb7185"/>
    <text x="1311" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#881337">Low reward</text>
    <text x="1311" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9f1239">parse failed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="292" width="242" height="114" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1311" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">Score final</text>
    <text x="1311" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">verdict</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="468" width="242" height="114" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1311" y="518" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">Check</text>
    <text x="1311" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">evidence IDs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="570" width="270" height="124" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="985" y="620" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">Check quote</text>
    <text x="985" y="650" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">appears in evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="478" y="570" width="280" height="124" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="618" y="620" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">Check</text>
    <text x="618" y="650" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a">unsupported spans</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M230 566 L406 658 L230 750 L54 658 Z" transform="translate(36 0)" fill="url(#check)" stroke="#94a3b8"/>
    <text x="266" y="636" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900" fill="#0f172a">Predicted support</text>
    <text x="266" y="664" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900" fill="#0f172a">for non-supported</text>
    <text x="266" y="692" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900" fill="#0f172a">gold?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="478" y="792" width="280" height="112" rx="18" fill="url(#bad)" stroke="#fb7185"/>
    <text x="618" y="842" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#881337">False-supported</text>
    <text x="618" y="872" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#881337">penalty</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="792" width="270" height="112" rx="18" fill="url(#good)" stroke="#22c55e"/>
    <text x="985" y="842" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#064e3b">Grounding</text>
    <text x="985" y="872" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#064e3b">reward kept</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1250" y="734" width="250" height="122" rx="18" fill="url(#reward)" stroke="#818cf8"/>
    <text x="1375" y="786" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" fill="#312e81">Total reward</text>
    <text x="1375" y="820" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4338ca">weighted score</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1536" y="734" width="190" height="122" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1631" y="786" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" fill="#0f172a">Policy</text>
    <text x="1631" y="820" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" fill="#0f172a">update</text>
  </g>

  <path d="M370 309 L472 309" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M758 309 L798 309" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1078 246 C1128 178 1146 160 1184 158" fill="none" stroke="#be123c" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="1130" y="210" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#be123c">no</text>
  <path d="M1128 309 L1184 342" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1146" y="330" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#334155">yes</text>
  <path d="M1311 406 L1311 462" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1190 526 C1142 568 1136 618 1124 632" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M850 632 L764 632" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M478 654 C438 658 418 658 402 658" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M408 706 C450 770 496 818 514 836" fill="none" stroke="#be123c" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="438" y="764" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#be123c">yes</text>
  <path d="M442 658 C602 706 762 756 858 816" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="612" y="716" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#334155">no</text>
  <path d="M758 848 L1244 800" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1120 848 L1244 806" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1500 795 L1530 795" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
