  <text x="48" y="94" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#17392f">② WHY SFT WINS: DENSE VERIFIER SUPERVISION</text>
  <text x="48" y="140" font-family="Arial, sans-serif" font-size="25" fill="#405f55">RL scores a completed verifier output; SFT supervises the claim trace token by token.</text>

