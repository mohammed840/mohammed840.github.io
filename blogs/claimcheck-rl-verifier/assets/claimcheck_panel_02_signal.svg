<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">SFT Teaches The Trace Directly</title>
  <desc id="desc">Diagram comparing RL scalar reward against SFT supervision over every field in a verifier JSON trace.</desc>
  <rect width="1500" height="760" fill="#f7f8f4"/>
  <text x="64" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#183d3a">② SFT TEACHES THE TRACE DIRECTLY</text>
  <text x="64" y="126" font-family="Arial, sans-serif" font-size="25" fill="#425f5a">RL receives one scalar after generation; SFT supervises the fields that make the verifier useful.</text>

  <text x="120" y="232" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#183d3a">RL update</text>
  <rect x="280" y="190" width="880" height="84" rx="18" fill="#ffffff" stroke="#cfd8d3" stroke-width="2"/>
  <text x="320" y="242" font-family="Arial, sans-serif" font-size="22" fill="#425f5a">generate full JSON</text>
  <circle cx="1116" cy="232" r="34" fill="#bf6f5a"/>
  <text x="1104" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">R</text>
  <text x="1192" y="238" font-family="Arial, sans-serif" font-size="22" fill="#7d3d2f">one scalar reward</text>

  <text x="120" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#183d3a">SFT update</text>
  <rect x="280" y="355" width="880" height="150" rx="18" fill="#eef5f4" stroke="#9ec4c1" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="318" y="393" width="135" height="44" rx="9" fill="#2d7785"/><text x="340" y="421" fill="#fff">verdict</text>
    <rect x="474" y="393" width="135" height="44" rx="9" fill="#2d7785"/><text x="503" y="421" fill="#fff">quote</text>
    <rect x="630" y="393" width="135" height="44" rx="9" fill="#2d7785"/><text x="651" y="421" fill="#fff">evidence</text>
    <rect x="786" y="393" width="135" height="44" rx="9" fill="#2d7785"/><text x="821" y="421" fill="#fff">span</text>
    <rect x="942" y="393" width="135" height="44" rx="9" fill="#2d7785"/><text x="973" y="421" fill="#fff">reason</text>
  </g>
  <text x="330" y="475" font-family="Arial, sans-serif" font-size="22" fill="#425f5a">direct token-level signal for each useful part of the trace</text>

  <text x="355" y="620" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#183d3a">This is why the SFT-only adapter became the best default verifier.</text>
  <text x="430" y="664" font-family="Arial, sans-serif" font-size="23" font-style="italic" fill="#425f5a">Same model, same task, but denser supervision for the exact behavior we need.</text>
</svg>
