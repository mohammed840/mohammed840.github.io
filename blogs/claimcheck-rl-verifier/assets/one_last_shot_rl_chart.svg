<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One Last Shot at RL</title>
  <desc id="desc">Bar chart comparing SFT-only Qwen 9B, SFT plus RL polish, and verdict-gated RL on mixed, hard, OOD, and multihop evaluation splits.</desc>
  <rect width="1200" height="720" fill="#fbfbf8"/>
  <text x="70" y="70" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111">One Last Shot at RL</text>
  <text x="70" y="105" font-family="Inter, Arial, sans-serif" font-size="18" fill="#444">Held-out reward by evaluation track. Higher is better.</text>

  <line x1="92" y1="560" x2="1120" y2="560" stroke="#222" stroke-width="2"/>
  <line x1="92" y1="150" x2="92" y2="560" stroke="#222" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#555">
    <line x1="92" y1="560" x2="1120" y2="560" stroke="#dadad4" stroke-width="1"/>
    <line x1="92" y1="478" x2="1120" y2="478" stroke="#dadad4" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="92" y1="396" x2="1120" y2="396" stroke="#dadad4" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="92" y1="314" x2="1120" y2="314" stroke="#dadad4" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="92" y1="232" x2="1120" y2="232" stroke="#dadad4" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="92" y1="150" x2="1120" y2="150" stroke="#dadad4" stroke-width="1" stroke-dasharray="6 6"/>
    <text x="44" y="565">0.4</text>
    <text x="44" y="483">0.5</text>
    <text x="44" y="401">0.6</text>
    <text x="44" y="319">0.7</text>
    <text x="44" y="237">0.8</text>
    <text x="44" y="155">0.9+</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="156" y="195" width="38" height="365" fill="#2f6fb0"/>
    <rect x="202" y="203" width="38" height="357" fill="#e6a23c"/>
    <rect x="248" y="198" width="38" height="362" fill="#299895"/>
    <text x="151" y="184" font-size="13" font-weight="700" fill="#111">0.844</text>
    <text x="197" y="192" font-size="13" font-weight="700" fill="#111">0.835</text>
    <text x="243" y="187" font-size="13" font-weight="700" fill="#111">0.841</text>
    <text x="180" y="605" font-size="18" font-weight="700" fill="#111">Mixed</text>

    <rect x="400" y="150" width="38" height="410" fill="#2f6fb0"/>
    <rect x="446" y="163" width="38" height="397" fill="#e6a23c"/>
    <rect x="492" y="176" width="38" height="384" fill="#299895"/>
    <text x="395" y="139" font-size="13" font-weight="700" fill="#111">0.916</text>
    <text x="441" y="152" font-size="13" font-weight="700" fill="#111">0.900</text>
    <text x="487" y="165" font-size="13" font-weight="700" fill="#111">0.884</text>
    <text x="425" y="605" font-size="18" font-weight="700" fill="#111">Hard</text>

    <rect x="644" y="149" width="38" height="411" fill="#2f6fb0"/>
    <rect x="690" y="158" width="38" height="402" fill="#e6a23c"/>
    <rect x="736" y="178" width="38" height="382" fill="#299895"/>
    <text x="639" y="138" font-size="13" font-weight="700" fill="#111">0.917</text>
    <text x="685" y="147" font-size="13" font-weight="700" fill="#111">0.905</text>
    <text x="731" y="167" font-size="13" font-weight="700" fill="#111">0.882</text>
    <text x="674" y="605" font-size="18" font-weight="700" fill="#111">OOD</text>

    <rect x="888" y="379" width="38" height="181" fill="#2f6fb0"/>
    <rect x="934" y="382" width="38" height="178" fill="#e6a23c"/>
    <rect x="980" y="298" width="38" height="262" fill="#299895"/>
    <text x="883" y="368" font-size="13" font-weight="700" fill="#111">0.622</text>
    <text x="929" y="371" font-size="13" font-weight="700" fill="#111">0.619</text>
    <text x="975" y="287" font-size="13" font-weight="700" fill="#111">0.720</text>
    <text x="898" y="605" font-size="18" font-weight="700" fill="#111">Multihop</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#111">
    <rect x="72" y="650" width="18" height="18" fill="#2f6fb0"/>
    <text x="98" y="665">SFT-only Qwen 9B</text>
    <rect x="282" y="650" width="18" height="18" fill="#e6a23c"/>
    <text x="308" y="665">SFT + RL polish</text>
    <rect x="470" y="650" width="18" height="18" fill="#299895"/>
    <text x="496" y="665">Verdict-gated RL</text>
  </g>

  <path d="M1018 300 C1070 290, 1085 245, 1095 212" fill="none" stroke="#299895" stroke-width="3"/>
  <path d="M1095 212 l-10 18 l21 -5 z" fill="#299895"/>
  <text x="955" y="208" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f6f6d">RL helps multihop</text>

  <path d="M760 178 C840 150, 878 190, 905 230" fill="none" stroke="#7b4a00" stroke-width="3"/>
  <path d="M905 230 l-18 -10 l8 20 z" fill="#7b4a00"/>
  <text x="810" y="143" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7b4a00">but hurts calibration</text>

  <rect x="70" y="620" width="1040" height="1" fill="#d7d7d2"/>
  <text x="70" y="700" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Takeaway: SFT wins overall; RL is useful as targeted pressure, not as the default verifier.</text>
</svg>
