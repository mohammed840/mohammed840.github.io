title: Mohammed Alshehri
description: Publications and research notes
url: "https://mohammed840.github.io"
baseurl: ""
theme: minima
markdown: kramdown
kramdown:
  input: GFM
collections:
  papers:
    output: true
    permalink: /papers/:name/
  blogs:
    output: true
    permalink: /blogs/:name/
defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
  - scope:
      path: ""
      type: blogs
    values:
      layout: blog
  - scope:
      path: ""
    values:
      layout: default
